[package]
name = "lppo-wgpu"
version = "1.0.0"
edition = "2021"
description = "wgpu graphics package for LPPO — WebGPU rendering via FFI."
repository = "https://github.com/AlexMatzen01/LPPwgpu"
license = "MIT"

[lib]
name = "lppo_wgpu"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = []
wasm = ["dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
wgpu = { version = "30", features = ["wgsl"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
raw-window-handle = "0.6"
once_cell = "1.17"
pollster = "1"

[dependencies.web-sys]
version = "0.3"
optional = true
features = ["HtmlCanvasElement", "Window", "Document"]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native-only: no extra deps beyond [dependencies]
